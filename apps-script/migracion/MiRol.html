<script>
  (function () {
    var HUB_IDS_MIROL = ['solicitud-mes-subsiguiente', 'cambios-voluntarios', 'descanso-medico', 'seguro-medico', 'cesion-vacaciones', 'grupos-pbs', 'cambios-web-sab']
    var currentHubItemMiRol = null

    window.hubScrollByMiRol = function (dir) {
      var track = document.getElementById('hub-carousel-track-mirol')
      track && track.scrollBy({ left: dir * 300, behavior: 'smooth' })
    }

    // Llamado desde showView() (ver Scripts.html) cada vez que se abandona
    // esta sección por completo (ej. ir a Gestión Personal, Gestión
    // Operacional o Inicio) — limpia todos los ítems y olvida cuál estaba
    // activo, para que al volver (aunque sea por un link sin "&item=") no
    // se arrastre nada de la visita anterior.
    window.resetMiRolHub = function () {
      currentHubItemMiRol = null
      HUB_IDS_MIROL.forEach(function (hid) {
        resetHubItemPanel('detalle-mirol-' + hid, hid)
      })
    }

    window.selectHubItemMiRol = function (id) {
      // Re-clickear la tarjeta YA activa no debe reventar lo que el
      // usuario esté llenando ahí mismo — solo se limpia al cambiar
      // realmente de ítem.
      if (id === currentHubItemMiRol) return
      currentHubItemMiRol = id
      HUB_IDS_MIROL.forEach(function (hid) {
        var panel = document.getElementById('detalle-mirol-' + hid)
        if (panel) panel.classList.add('hidden')
        // Restablece SIEMPRE, no solo el ítem que se deja: así, si el
        // usuario ya lo había visitado antes y lo dejó con campos llenos o
        // acordeones abiertos, lo vuelve a encontrar limpio la próxima vez.
        resetHubItemPanel('detalle-mirol-' + hid, hid)
        var card = document.getElementById('carousel-item-mirol-' + hid)
        if (card) {
          var active = hid === id
          card.classList.toggle('scale-[1.04]', active)
          card.classList.toggle('border-latam-estrellada', active)
          card.classList.toggle('shadow-card', active)
          card.classList.toggle('border-slate-200', !active)
          card.classList.toggle('shadow-sm', !active)
          var title = card.querySelector('.hub-card-title')
          var cta = card.querySelector('.hub-card-cta')
          if (title) { title.classList.toggle('text-latam-coral', active); title.classList.toggle('text-latam-estrellada', !active) }
          if (cta) { cta.classList.toggle('bg-latam-estrellada', active); cta.classList.toggle('text-white', active); cta.classList.toggle('bg-slate-100', !active) }
        }
      })
      document.getElementById('detalle-empty-mirol').classList.add('hidden')
      var target = document.getElementById('detalle-mirol-' + id)
      if (target) target.classList.remove('hidden')

      var cardEl = document.getElementById('carousel-item-mirol-' + id)
      if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' })
      requestAnimationFrame(function () {
        document.getElementById('detalle-seleccion-mirol').scrollIntoView({ behavior: 'smooth', block: 'start' })
      })
    }

    var initialItemMiRol = '<?= itemId ?>'
    if (initialItemMiRol && HUB_IDS_MIROL.indexOf(initialItemMiRol) !== -1) {
      setTimeout(function () { selectHubItemMiRol(initialItemMiRol) }, 350)
    }
  })()
</script>
