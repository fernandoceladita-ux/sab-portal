<script>
  (function () {
    var HUB_IDS_GO = ['instructivo-vales', 'consultas-viaticos', 'cambio-uniforme', 'registro-sunat']

    window.hubScrollByGestionOperacional = function (dir) {
      var track = document.getElementById('hub-carousel-track-go')
      track && track.scrollBy({ left: dir * 300, behavior: 'smooth' })
    }

    window.selectHubItemGestionOperacional = function (id) {
      HUB_IDS_GO.forEach(function (hid) {
        var panel = document.getElementById('detalle-go-' + hid)
        if (panel) panel.classList.add('hidden')
        var card = document.getElementById('carousel-item-go-' + hid)
        if (card) {
          var active = hid === id
          card.classList.toggle('scale-[1.04]', active)
          card.classList.toggle('border-latam-estrellada', active)
          card.classList.toggle('shadow-card', active)
          card.classList.toggle('border-slate-200', !active)
          card.classList.toggle('shadow-sm', !active)
          var title = card.querySelector('.hub-card-title')
          var cta = card.querySelector('.hub-card-cta')
          if (title) { title.classList.toggle('text-latam-coral', active); title.classList.toggle('text-latam-estrellada', !active) }
          if (cta) { cta.classList.toggle('bg-latam-estrellada', active); cta.classList.toggle('text-white', active); cta.classList.toggle('bg-slate-100', !active) }
        }
      })
      document.getElementById('detalle-empty-go').classList.add('hidden')
      var target = document.getElementById('detalle-go-' + id)
      if (target) target.classList.remove('hidden')

      var cardEl = document.getElementById('carousel-item-go-' + id)
      if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' })
      requestAnimationFrame(function () {
        document.getElementById('detalle-seleccion-go').scrollIntoView({ behavior: 'smooth', block: 'start' })
      })
    }

    var initialItemGO = '<?= itemId ?>'
    if (initialItemGO && HUB_IDS_GO.indexOf(initialItemGO) !== -1) {
      setTimeout(function () { selectHubItemGestionOperacional(initialItemGO) }, 350)
    }
  })()
</script>
