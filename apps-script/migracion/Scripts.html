<script>
  // ===================== Header: fondo sólido al hacer scroll =====================
  const header = document.getElementById('site-header')
  const brandLabel = document.getElementById('brand-label')
  const logoWhite = document.getElementById('logo-white')
  const logoColor = document.getElementById('logo-color')
  const mobileDrawer = document.getElementById('mobile-drawer')
  const mobileOverlay = document.getElementById('mobile-overlay')
  let mobileOpen = false

  function applyHeaderSkin() {
    const solid = window.scrollY > 8 || mobileOpen
    if (solid) {
      header.classList.add('border-slate-200', 'bg-white/90', 'shadow-sm', 'backdrop-blur-md')
      header.classList.remove('border-transparent', 'bg-transparent')
      brandLabel.classList.add('text-latam-estrellada')
      brandLabel.classList.remove('text-white')
    } else {
      header.classList.remove('border-slate-200', 'bg-white/90', 'shadow-sm', 'backdrop-blur-md')
      header.classList.add('border-transparent', 'bg-transparent')
      brandLabel.classList.remove('text-latam-estrellada')
      brandLabel.classList.add('text-white')
    }
    // Logo blanco sobre el hero transparente, logo a color en cuanto el
    // header se pone blanco al hacer scroll (si no, se pierde contra el
    // fondo blanco). Mismo criterio "solid" que ya usa brand-label.
    logoWhite.classList.toggle('hidden', solid)
    logoColor.classList.toggle('hidden', !solid)
    document.querySelectorAll('.nav-inicio, .menu-trigger').forEach((el) => {
      if (solid) {
        el.classList.add('text-slate-700')
        el.classList.remove('text-white/85', 'text-white')
      } else {
        el.classList.remove('text-slate-700')
        el.classList.add('text-white/85')
      }
    })
    document.getElementById('mobile-toggle').classList.toggle('text-latam-estrellada', solid)
    document.getElementById('mobile-toggle').classList.toggle('text-white', !solid)
    document.getElementById('search-toggle').classList.toggle('text-latam-estrellada', solid)
    document.getElementById('search-toggle').classList.toggle('text-white', !solid)
  }
  window.addEventListener('scroll', applyHeaderSkin, { passive: true })
  applyHeaderSkin()

  // ===================== Buscador del header =====================
  // Mismos 15 ítems que ya están en los mega-menús/drawer (ver Header.html)
  // — se listan acá aparte en vez de leerlos del DOM porque algunos abren
  // en pestaña nueva (Renovación de Fotocheck, vía AppSheet) y necesitan
  // ese comportamiento distinto al navegar desde un resultado.
  const SEARCH_INDEX = [
    { title: 'Actualización de Datos', module: 'Gestión Personal', href: '?page=gestion-personal&item=actualizacion-datos', dot: 'bg-latam-diavivo' },
    { title: 'Renovación de Fotocheck', module: 'Gestión Personal', href: 'https://www.appsheet.com/Account/Login?appName=Solicitud%20De%20Credenciales%20PE&FullScope=False&provider=google&returnUrl=https%3A%2F%2Fwww.appsheet.com%2Fstart%2Ffc09f2b3-fd11-46ae-882b-d8ce2cb7a8d1%3Fplatform%3Ddesktop#appName=SolicitudDeCredencialesPE-501453028&vss=H4sIAAAAAAAAA6WOOw7CMBAF7_Jqn8AliAIhaEA0mMLEG8kisaPYCUSW786aj1ID5b7VjCZhtHTbR11dIU9pvjY0QSIpHKaOFKTC0rvY-0ZBKOx0-xoXltxIzhqtkJHP4mOIFCDTtwL5b4GANeSirS31xVZYtrxJfheOh5lCFmiHqC8NPbOZypm32ldDIHPknJ8ywtqt7p12ZusNS2vdBMoPSSDo2G8BAAA=&view=Bienvenida', dot: 'bg-latam-diavivo', external: true },
    { title: 'Domicilio DGAC', module: 'Gestión Personal', href: '?page=gestion-personal&item=domicilio-dgac', dot: 'bg-latam-diavivo' },
    { title: 'Vacuna Fiebre Amarilla', module: 'Gestión Personal', href: '?page=gestion-personal&item=vacuna-fiebre-amarilla', dot: 'bg-latam-diavivo' },
    { title: 'Procedimiento Visa / Pasaporte', module: 'Gestión Personal', href: '?page=gestion-personal&item=visa-pasaporte', dot: 'bg-latam-diavivo' },
    { title: 'Solicitud Mes Subsiguiente', module: 'Mi Rol', href: '?page=mi-rol&item=solicitud-mes-subsiguiente', dot: 'bg-latam-estrellada' },
    { title: 'Cambios Voluntarios', module: 'Mi Rol', href: '?page=mi-rol&item=cambios-voluntarios', dot: 'bg-latam-estrellada' },
    { title: 'Descanso Médico', module: 'Mi Rol', href: '?page=mi-rol&item=descanso-medico', dot: 'bg-latam-estrellada' },
    { title: 'Activa tu seguro Médico', module: 'Mi Rol', href: '?page=mi-rol&item=seguro-medico', dot: 'bg-latam-estrellada' },
    { title: 'Intercambio o Cesión de Vacaciones', module: 'Mi Rol', href: '?page=mi-rol&item=cesion-vacaciones', dot: 'bg-latam-estrellada' },
    { title: 'Grupos PBS 2026', module: 'Mi Rol', href: '?page=mi-rol&item=grupos-pbs', dot: 'bg-latam-estrellada' },
    { title: 'Cambios Web SAB LP', module: 'Mi Rol', href: '?page=mi-rol&item=cambios-web-sab', dot: 'bg-latam-estrellada' },
    { title: 'Instructivo de Vales', module: 'Gestión Operacional', href: '?page=gestion-operacional&item=instructivo-vales', dot: 'bg-latam-profunda' },
    { title: 'Consultas Viáticos y Horas de Vuelo', module: 'Gestión Operacional', href: '?page=gestion-operacional&item=consultas-viaticos', dot: 'bg-latam-profunda' },
    { title: 'Cambio de Uniforme', module: 'Gestión Operacional', href: '?page=gestion-operacional&item=cambio-uniforme', dot: 'bg-latam-profunda' },
    { title: 'Registro de Equipos SUNAT', module: 'Gestión Operacional', href: '?page=gestion-operacional&item=registro-sunat', dot: 'bg-latam-profunda' },
  ]

  function normalizeSearch(str) {
    return str.toLowerCase()
      .replace(/[áàä]/g, 'a')
      .replace(/[éèë]/g, 'e')
      .replace(/[íìï]/g, 'i')
      .replace(/[óòö]/g, 'o')
      .replace(/[úùü]/g, 'u')
      .replace(/ñ/g, 'n')
  }

  function toggleSearch() {
    const panel = document.getElementById('search-panel')
    const isOpen = !panel.classList.contains('hidden')
    if (isOpen) {
      closeSearch()
      return
    }
    closeAllMenus()
    panel.classList.remove('hidden')
    const input = document.getElementById('search-input')
    input.value = ''
    renderSearchResults('')
    setTimeout(() => input.focus(), 0)
  }
  function closeSearch() {
    document.getElementById('search-panel').classList.add('hidden')
  }
  function handleSearchInput(value) {
    renderSearchResults(value)
  }
  function handleSearchKeydown(e) {
    if (e.key !== 'Enter') return
    const first = document.querySelector('#search-results a')
    if (!first) return
    if (first.target === '_blank') window.open(first.href, '_blank', 'noopener,noreferrer')
    else window.location.href = first.href
  }
  function renderSearchResults(query) {
    const results = document.getElementById('search-results')
    const q = normalizeSearch(query.trim())
    if (!q) {
      results.innerHTML = ''
      return
    }
    const matches = SEARCH_INDEX.filter((item) => normalizeSearch(item.title).includes(q))
    if (!matches.length) {
      results.innerHTML = '<p class="px-3 py-4 text-center text-[13px] font-semibold text-slate-400">No se encontraron trámites para &quot;' + query.trim() + '&quot;.</p>'
      return
    }
    results.innerHTML = matches.map((item) => (
      '<a href="' + item.href + '"' + (item.external ? ' target="_blank" rel="noopener noreferrer"' : '') + ' class="flex items-center gap-3 rounded-xl px-3 py-2.5 transition hover:bg-slate-50">' +
        '<span class="h-2 w-2 flex-shrink-0 rounded-full ' + item.dot + '"></span>' +
        '<span class="flex flex-col">' +
          '<span class="text-[14px] font-bold text-slate-800">' + item.title + '</span>' +
          '<span class="text-[12px] font-semibold text-slate-400">' + item.module + '</span>' +
        '</span>' +
      '</a>'
    )).join('')
  }
  document.addEventListener('mousedown', (e) => {
    const panel = document.getElementById('search-panel')
    if (panel.classList.contains('hidden')) return
    const toggle = document.getElementById('search-toggle')
    if (!panel.contains(e.target) && !toggle.contains(e.target)) closeSearch()
  })

  // ===================== Mega-menú desktop =====================
  let openMenuKey = null
  function toggleMenu(key) {
    closeSearch()
    document.querySelectorAll('.mega-panel').forEach((p) => {
      if (p.id !== 'menu-' + key) p.classList.add('hidden')
    })
    document.querySelectorAll('.menu-trigger .chevron').forEach((c) => c.classList.remove('rotate-180'))
    const panel = document.getElementById('menu-' + key)
    const isOpen = !panel.classList.contains('hidden')
    if (isOpen) {
      panel.classList.add('hidden')
      openMenuKey = null
    } else {
      panel.classList.remove('hidden')
      openMenuKey = key
      document.querySelector('.menu-trigger[data-module="' + key + '"] .chevron').classList.add('rotate-180')
    }
  }
  document.addEventListener('mousedown', (e) => {
    if (!openMenuKey) return
    const panel = document.getElementById('menu-' + openMenuKey)
    const trigger = document.querySelector('.menu-trigger[data-module="' + openMenuKey + '"]')
    if (panel && !panel.contains(e.target) && trigger && !trigger.contains(e.target)) {
      panel.classList.add('hidden')
      document.querySelectorAll('.menu-trigger .chevron').forEach((c) => c.classList.remove('rotate-180'))
      openMenuKey = null
    }
  })

  // ===================== Drawer mobile =====================
  function toggleMobileMenu() {
    closeSearch()
    mobileOpen = !mobileOpen
    document.getElementById('icon-menu').classList.toggle('hidden', mobileOpen)
    document.getElementById('icon-close').classList.toggle('hidden', !mobileOpen)
    mobileOverlay.classList.toggle('hidden', !mobileOpen)
    mobileDrawer.classList.toggle('grid-rows-[0fr]', !mobileOpen)
    mobileDrawer.classList.toggle('grid-rows-[1fr]', mobileOpen)
    mobileDrawer.classList.toggle('border-t', mobileOpen)
    mobileDrawer.classList.toggle('border-slate-100', mobileOpen)
    // Al cerrar, colapsa cualquier grupo (Gestión Personal / Mi Rol /
    // Gestión Operacional) que hubiera quedado expandido — si no, la
    // próxima vez que se abra el drawer aparece tal como se dejó la vez
    // anterior en lugar de arrancar siempre colapsado.
    if (!mobileOpen) resetMobileGroups()
    applyHeaderSkin()
  }
  function closeMobileMenu() {
    if (mobileOpen) toggleMobileMenu()
  }

  // Espeja el useEffect de Header.jsx que escucha `location.key`: en React,
  // CUALQUIER navegación (incluido solo cambiar `?item=` dentro del mismo
  // módulo) cierra el drawer móvil y el mega-menú desktop. Acá se llama a
  // mano después de cada click que cambia de vista (ver showView más abajo),
  // ya que no hay un cambio de "location" real que lo dispare solo.
  function closeAllMenus() {
    document.querySelectorAll('.mega-panel').forEach((p) => p.classList.add('hidden'))
    document.querySelectorAll('.menu-trigger .chevron').forEach((c) => c.classList.remove('rotate-180'))
    openMenuKey = null
    closeMobileMenu()
    closeSearch()
  }
  // Mismo acento por módulo que MODULE_ACCENTS en Header.jsx.
  const MOBILE_MODULE_BG = {
    'gestion-personal': 'bg-latam-diavivo',
    'mi-rol': 'bg-latam-estrellada',
    'gestion-operacional': 'bg-latam-profunda',
  }

  // Colapsa todos los grupos del drawer mobile y restaura chevrons/botones a
  // su estado por defecto — usado tanto al abrir/cerrar otro grupo como al
  // cerrar el drawer entero (ver toggleMobileMenu).
  function resetMobileGroups() {
    document.querySelectorAll('[id^="mobile-panel-"]').forEach((p) => {
      p.classList.remove('grid-rows-[1fr]')
      p.classList.add('grid-rows-[0fr]')
    })
    // El chevron usa su propio color de módulo (text-latam-*) para verse
    // sobre fondo blanco cuando está cerrado — pero al abrirse el botón
    // toma ESE MISMO color como fondo, así que si no se cambia el chevron a
    // blanco queda invisible (mismo color sobre sí mismo). Por eso se
    // intercambia con la clase guardada en data-color-class en vez de solo
    // rotarlo.
    document.querySelectorAll('[data-mobile-module] .chevron').forEach((c) => {
      c.classList.remove('rotate-180', 'text-white')
      const colorClass = c.getAttribute('data-color-class')
      if (colorClass) c.classList.add(colorClass)
    })
    document.querySelectorAll('[data-mobile-module]').forEach((b) => {
      b.classList.remove('text-white', ...Object.values(MOBILE_MODULE_BG))
      b.classList.add('text-slate-800')
    })
  }

  function toggleMobileGroup(key) {
    const panel = document.getElementById('mobile-panel-' + key)
    const isOpen = panel.classList.contains('grid-rows-[1fr]')
    // resetMobileGroups() colapsa TODOS los grupos (incluido este) — si ya
    // estaba abierto, con eso basta (es el comportamiento de "toggle": un
    // segundo click sobre el mismo grupo lo cierra). Si estaba cerrado, se
    // reabre explícitamente después.
    resetMobileGroups()
    if (!isOpen) {
      panel.classList.remove('grid-rows-[0fr]')
      panel.classList.add('grid-rows-[1fr]')
      const btn = document.querySelector('[data-mobile-module="' + key + '"]')
      const chevron = btn.querySelector('.chevron')
      chevron.classList.add('rotate-180', 'text-white')
      const colorClass = chevron.getAttribute('data-color-class')
      if (colorClass) chevron.classList.remove(colorClass)
      btn.classList.remove('text-slate-800')
      btn.classList.add('text-white', MOBILE_MODULE_BG[key] || 'bg-latam-estrellada')
    }
  }

  // ===================== FAQ accordion =====================
  function toggleFaq(btn) {
    const item = btn.closest('.faq-item')
    const panel = item.querySelector('.faq-panel')
    const chevron = btn.querySelector('.chevron')
    const isOpen = panel.classList.contains('grid-rows-[1fr]')
    document.querySelectorAll('.faq-panel').forEach((p) => {
      p.classList.remove('grid-rows-[1fr]')
      p.classList.add('grid-rows-[0fr]')
    })
    document.querySelectorAll('.faq-item .chevron').forEach((c) => c.classList.remove('rotate-180'))
    if (!isOpen) {
      panel.classList.remove('grid-rows-[0fr]')
      panel.classList.add('grid-rows-[1fr]')
      chevron.classList.add('rotate-180')
    }
  }

  // ===================== Carrusel de novedades =====================
  const NOVELTY_COUNT = 3
  const NOVELTY_AUTO_MS = 15000
  const noveltyTrack = document.getElementById('novelty-track')
  let noveltyIndex = 0
  let noveltyTimer = null

  function noveltyGoTo(i) {
    const child = noveltyTrack.children[i]
    if (!child) return
    noveltyTrack.scrollTo({ left: child.offsetLeft, behavior: 'smooth' })
  }

  function updateNoveltyUI(i) {
    noveltyIndex = i
    document.querySelectorAll('[data-novelty-dot]').forEach((dot) => {
      const idx = Number(dot.dataset.noveltyDot)
      if (idx === i) {
        dot.classList.add('w-6', 'bg-latam-coral')
        dot.classList.remove('w-1.5', 'bg-white/40')
      } else {
        dot.classList.remove('w-6', 'bg-latam-coral')
        dot.classList.add('w-1.5', 'bg-white/40')
      }
    })
    const btnWrap = document.getElementById('novelty-btn-wrap')
    const btn = btnWrap.querySelector('.novelty-btn')
    btn.setAttribute('onclick', 'openNewsDetail(' + i + ')')
    btnWrap.classList.remove('animate-fadeIn')
    void btnWrap.offsetWidth
    btnWrap.classList.add('animate-fadeIn')
  }

  if (noveltyTrack) {
    const io = new IntersectionObserver(
      (entries) => {
        const mostVisible = entries.filter((e) => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0]
        if (mostVisible) {
          const idx = Array.from(noveltyTrack.children).indexOf(mostVisible.target)
          if (idx !== -1) updateNoveltyUI(idx)
        }
      },
      { root: noveltyTrack, threshold: [0.5, 0.75, 1] },
    )
    Array.from(noveltyTrack.children).forEach((s) => io.observe(s))

    noveltyTimer = setInterval(() => {
      noveltyGoTo((noveltyIndex + 1) % NOVELTY_COUNT)
    }, NOVELTY_AUTO_MS)
  }

  // ===================== Modal: detalle de noticia =====================
  function openNewsDetail(index) {
    document.querySelectorAll('.news-panel').forEach((p) => p.classList.add('hidden'))
    const panel = document.querySelector('[data-news-panel="' + index + '"]')
    if (panel) panel.classList.remove('hidden')
    openModal('modal-news')
  }

  // ===================== Modales genéricos =====================
  function openModal(id) {
    const modal = document.getElementById(id)
    modal.classList.remove('hidden')
    modal.classList.add('flex')
    document.body.style.overflow = 'hidden'
  }
  function closeModal(id) {
    const modal = document.getElementById(id)
    modal.classList.add('hidden')
    modal.classList.remove('flex')
    document.body.style.overflow = ''
  }
  function closeModalBackdrop(e, id) {
    if (e.target.id === id) closeModal(id)
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return
    document.querySelectorAll('.modal-overlay:not(.hidden)').forEach((m) => closeModal(m.id))
    closeSearch()
  })

  // ===================== Formularios de los modales (simulados) =====================
  // Igual que en la versión React: por ahora estos dos formularios no están
  // conectados a un backend real, solo simulan el envío (setTimeout). Se
  // pueden conectar más adelante al mismo bridge de Google Sheets que usan
  // los formularios de trámites (ver /apps-script/Code.gs).
  function fakeSubmit(e, formId, successId, modalId) {
    e.preventDefault()
    const form = document.getElementById(formId)
    if (!form.checkValidity()) {
      form.reportValidity()
      return
    }
    const btn = form.querySelector('button[type="submit"]')
    const label = btn.querySelector('.btn-label')
    btn.disabled = true
    const originalText = label.textContent
    label.textContent = 'Enviando...'
    setTimeout(() => {
      form.classList.add('hidden')
      document.getElementById(successId).classList.remove('hidden')
      document.getElementById(successId).classList.add('flex')
      setTimeout(() => {
        closeModal(modalId)
        form.reset()
        form.classList.remove('hidden')
        document.getElementById(successId).classList.add('hidden')
        document.getElementById(successId).classList.remove('flex')
        btn.disabled = false
        label.textContent = originalText
        if (formId === 'form-absentismo') clearFile('absentismo')
      }, 1800)
    }, 700)
  }

  // ===================== Upload de archivo (modal Absentismo) =====================
  function handleFileChange(input, prefix) {
    const file = input.files && input.files[0]
    if (!file) return
    document.getElementById(prefix + '-file-idle').classList.add('hidden')
    const done = document.getElementById(prefix + '-file-done')
    done.classList.remove('hidden')
    done.classList.add('flex')
    document.getElementById(prefix + '-file-name').textContent = file.name
  }
  function clearFile(prefix) {
    const input = document.getElementById(prefix + '-file-input')
    input.value = ''
    document.getElementById(prefix + '-file-idle').classList.remove('hidden')
    const done = document.getElementById(prefix + '-file-done')
    done.classList.add('hidden')
    done.classList.remove('flex')
  }

  // ===================== Reveal-on-scroll (FAQ / Centro de Ayuda) =====================
  const revealIo = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('translate-y-0', 'opacity-100')
          entry.target.classList.remove('translate-y-8', 'opacity-0')
          revealIo.unobserve(entry.target)
        }
      })
    },
    { threshold: 0.15, rootMargin: '0px 0px -60px 0px' },
  )
  document.querySelectorAll('.reveal').forEach((el) => {
    el.classList.add('translate-y-8', 'opacity-0', 'transition-all', 'duration-700', 'ease-out')
    revealIo.observe(el)
  })

  // ===================== Botón "atrás" del teléfono =====================
  // Si el navegador restaura esta página desde su caché de retroceso
  // (bfcache), el DOM vuelve exactamente como quedó al salir — y si salimos
  // en medio de un pageWipeTo() (cobertura a pantalla completa, a punto de
  // navegar), el overlay queda congelado visible. `pageshow` con
  // `event.persisted` detecta ese caso (no pasa en una carga normal) y
  // oculta el overlay directo por JS — sin recargar ni navegar, para no
  // arriesgar colgar el iframe sandbox de Apps Script.
  window.addEventListener('pageshow', (event) => {
    if (!event.persisted) return
    const colorEl = document.getElementById('page-wipe-color')
    const wrap = document.getElementById('page-wipe-icon-wrap')
    if (colorEl) colorEl.className = 'pointer-events-none fixed inset-0 z-[200] opacity-0'
    if (wrap) { wrap.classList.add('hidden'); wrap.classList.remove('flex') }
  })

  // ===================== Footer year =====================
  const footerYear = document.getElementById('footer-year')
  if (footerYear) footerYear.textContent = new Date().getFullYear()

  // ===================== Acordeón genérico (Domicilio DGAC / Fiebre Amarilla / Visa-Pasaporte) =====================
  // A diferencia de toggleStep(n) en ActualizacionDatosScript.html (que
  // asume IDs "step-N-body"), estas 3 vistas nuevas conviven todas en el
  // mismo documento con sus propios pasos numerados — así que reciben el id
  // exacto en vez de armarlo a partir de un número.
  function toggleAccordion(bodyId, chevronId) {
    const body = document.getElementById(bodyId)
    const chevron = document.getElementById(chevronId)
    if (!body) return
    const isOpen = body.style.gridTemplateRows === '1fr'
    body.style.gridTemplateRows = isOpen ? '0fr' : '1fr'
    if (chevron) chevron.classList.toggle('rotate-180', !isOpen)
  }

  // ===================== Reset de subsecciones al cambiar de ítem =====================
  // El sitio es una SPA: los paneles de cada ítem de un hub (Gestión
  // Personal / Mi Rol / Gestión Operacional) nunca se destruyen, solo se
  // ocultan con `hidden` — así que si no se limpian a mano, un formulario
  // llenado o un acordeón abierto en "Domicilio DGAC" se queda exactamente
  // así aunque el usuario navegue a otra subsección y vuelva. Por eso cada
  // selectHubItem*() (ver GestionPersonal.html/MiRol.html/
  // GestionOperacional.html) llama a resetHubItemPanel() para TODOS los
  // ítems del hub en cada cambio, no solo el que se está por mostrar.
  //
  // 1) Colapsa cualquier acordeón dentro del panel (todo bodyId/chevronId
  //    de este sitio sigue el patrón "X-body" / "X-chevron", así que basta
  //    con buscarlos por sufijo — no hace falta conocer los ids exactos de
  //    cada vista).
  function collapseAccordionsIn(root) {
    if (!root) return
    root.querySelectorAll('[id$="-body"]').forEach((body) => {
      body.style.gridTemplateRows = '0fr'
      const chevron = document.getElementById(body.id.replace(/-body$/, '-chevron'))
      if (chevron) chevron.classList.remove('rotate-180')
    })
  }

  // 2) Además del acordeón, varias vistas guardan su propio estado JS
  //    (trámite/novedad/tipo/canal elegido, archivo adjunto, panel de
  //    detalle mostrado, tab activo) que un simple reset de <form> no
  //    toca — cada una ya expone su propia función "clear*"/"reset*" para
  //    esto (botón "Borrar formulario" o equivalente); este mapa solo
  //    conecta el id del ítem con el nombre de esa función.
  const HUB_ITEM_RESET_FN = {
    'actualizacion-datos': 'clearTramiteForm',
    'domicilio-dgac': 'clearDomicilioForm',
    'solicitud-mes-subsiguiente': 'clearMesForm',
    'descanso-medico': 'clearDmForm',
    'cesion-vacaciones': 'clearVacForm',
    'cambio-uniforme': 'clearUnForm',
    'registro-sunat': 'clearRsForm',
    'cambios-voluntarios': 'resetCambiosVoluntarios',
    'cambios-web-sab': 'resetCambiosWebSab',
    'instructivo-vales': 'resetInstructivoVales',
  }

  function resetHubItemPanel(panelId, itemId) {
    collapseAccordionsIn(document.getElementById(panelId))
    const fnName = HUB_ITEM_RESET_FN[itemId]
    if (fnName && typeof window[fnName] === 'function') window[fnName]()
  }

  // ===================== Plantilla WhatsApp (Vacuna Fiebre Amarilla) =====================
  // navigator.clipboard.writeText() necesita el permiso "clipboard-write"
  // delegado en cada capa de iframe anidado (Google Sites → wrapper de Apps
  // Script → sandbox interno) — permiso que no controlamos, y que móvil
  // suele exigir más estricto que escritorio (donde a veces igual deja
  // pasar). document.execCommand('copy') es más antiguo pero no depende de
  // ese permiso, así que sirve de respaldo cuando el moderno falla.
  function legacyCopyToClipboard(text) {
    const ta = document.createElement('textarea')
    ta.value = text
    ta.style.position = 'fixed'
    ta.style.top = '-1000px'
    ta.style.opacity = '0'
    document.body.appendChild(ta)
    ta.focus()
    ta.select()
    let ok = false
    try { ok = document.execCommand('copy') } catch (e) { ok = false }
    document.body.removeChild(ta)
    return ok
  }

  async function copyFiebreTemplate() {
    const text = 'Nombres y Apellidos:\nFecha de Nacimiento:\nEdad:\nEmail Corporativo:\nDocumento de Identidad:\nDirección de Domicilio: '
    let copied = false
    try {
      await navigator.clipboard.writeText(text)
      copied = true
    } catch (e) {
      copied = legacyCopyToClipboard(text)
    }
    if (!copied) return
    const btn = document.getElementById('fiebre-copy-btn')
    const label = document.getElementById('fiebre-copy-label')
    const icon = document.getElementById('fiebre-copy-icon')
    btn.classList.remove('bg-latam-estrellada')
    btn.classList.add('bg-green-600')
    label.textContent = '¡Copiado al portapapeles!'
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="h-4 w-4"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    setTimeout(() => {
      btn.classList.add('bg-latam-estrellada')
      btn.classList.remove('bg-green-600')
      label.textContent = 'Copiar Plantilla'
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="h-4 w-4"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9V4Z"/><path d="M8.5 12h7M8.5 15.5h4.5" stroke-linecap="round"/></svg>'
    }, 2200)
  }

  // ===================== "Abrir Ficha de Actualización" (Fiebre/Visa → Actualización de Datos) =====================
  // Espeja los <Link to="/gestion-personal?item=actualizacion-datos&tramite=X">
  // de FiebreAmarillaView.jsx / VisaPasaporteView.jsx: abre el hub de
  // Actualización de Datos con el trámite correspondiente ya seleccionado.
  function openTramiteFromLink(tramiteId) {
    if (typeof selectHubItem === 'function') selectHubItem('actualizacion-datos')
    setTimeout(() => {
      if (typeof selectTramite === 'function') selectTramite(tramiteId)
      if (typeof toggleStep === 'function') {
        const body = document.getElementById('step-2-body')
        if (body && body.style.gridTemplateRows !== '1fr') toggleStep(2)
      }
    }, 60)
  }

  // ===================== Vistas embebidas (Home / Gestión Personal) =====================
  // Home y Gestión Personal viven siempre las dos en el mismo documento (ver
  // Index.html) — cambiar entre ellas es solo mostrar/ocultar un <div> por
  // JS, nunca una navegación real. Por qué: Google Sites, al embeber esta
  // Web App en un iframe, no le da permiso al sandbox interno de Apps
  // Script para navegar nada por fuera de sí mismo — ni siquiera un nivel
  // hacia arriba — así que cualquier navegación real (aunque sea dentro del
  // mismo dominio) queda bloqueada o se rompe tras el primer clic. Al no
  // navegar nunca, ese bloqueo deja de aplicar por completo.
  //
  // A propósito NO se toca el historial del navegador (nada de
  // history.pushState) — dentro del sandbox anidado de Sites no podemos
  // saber ni controlar cómo se integra con el botón físico de atrás del
  // teléfono (en la práctica, se probó y el resultado era inconsistente).
  // Para volver a Home se usa la navegación normal dentro de la app (el
  // logo/"Inicio"), no el botón de atrás.
  // Cada hub (Gestión Personal / Mi Rol / Gestión Operacional) expone su
  // propia función "resetXHub" (ver GestionPersonal.html/MiRol.html/
  // GestionOperacional.html) que limpia TODOS sus ítems y olvida cuál
  // estaba activo. Se dispara desde showView() cada vez que se deja esa
  // sección — así, aunque el usuario vuelva más tarde sin pasar por un
  // link con "&item=" (ej. el logo/"Inicio" o una pestaña sin ítem), el
  // hub ya no arrastra formularios llenos ni acordeones abiertos de la
  // visita anterior.
  const VIEW_HUB_RESET_FN = {
    'view-gestion-personal': 'resetGestionPersonalHub',
    'view-mi-rol': 'resetMiRolHub',
    'view-gestion-operacional': 'resetGestionOperacionalHub',
  }

  function showView(name) {
    const target = document.getElementById('view-' + name)
    if (!target) return false
    const leaving = document.querySelector('[id^="view-"]:not(.hidden)')
    document.querySelectorAll('[id^="view-"]').forEach((el) => el.classList.add('hidden'))
    target.classList.remove('hidden')
    if (leaving && leaving !== target) {
      const fnName = VIEW_HUB_RESET_FN[leaving.id]
      if (fnName && typeof window[fnName] === 'function') window[fnName]()
    }
    window.scrollTo(0, 0)
    return true
  }

  // ===================== Page wipe (transición de color al navegar en móvil) =====================
  // Espeja PageWipe.jsx + OptionCard.jsx de React: al tocar una tarjeta de
  // módulo en móvil, cubre la pantalla con el color e ícono del módulo,
  // navega, y en la página destino se desvanece. Como aquí cada `?page=`
  // es una carga de página nueva (no un SPA), la continuidad entre la
  // cobertura (página origen) y el desvanecido (página destino) se pasa
  // por sessionStorage; el "cubrir de entrada, sin animar" ya lo hace el
  // script inline al inicio del <body> (evita el parpadeo del contenido
  // real antes de que este script, al final del <body>, llegue a correr).
  const PAGE_WIPE_KEY = 'sabPageWipe'
  const PAGE_WIPE_COVER_MS = 1050
  const PAGE_WIPE_REVEAL_MS = 380

  function pageWipeIsMobile() {
    // DESACTIVADO TEMPORALMENTE para descartar si el wipe es la causa del
    // pantallazo blanco al usar el botón atrás del teléfono. Para reactivar,
    // vuelve a: return window.matchMedia('(max-width: 639px)').matches
    return false
  }

  function pageWipeTo(to, color, label, icon) {
    if (!pageWipeIsMobile()) {
      window.location.href = to
      return
    }
    try {
      sessionStorage.setItem(PAGE_WIPE_KEY, JSON.stringify({ color, label, icon }))
    } catch (e) {}

    const colorEl = document.getElementById('page-wipe-color')
    const wrap = document.getElementById('page-wipe-icon-wrap')
    const img = document.getElementById('page-wipe-icon')
    if (colorEl && wrap && img) {
      img.src = icon || ''
      img.alt = label || ''
      colorEl.className = `pointer-events-none fixed inset-0 z-[200] ease-out ${color} opacity-0`
      wrap.className = 'pointer-events-none fixed inset-0 z-[210] flex flex-col items-center justify-center sm:hidden'
      img.className = 'w-56 max-w-[70vw] object-contain scale-50 opacity-0 transition-all duration-300 ease-out'
      // Fuerza reflow para que el cambio a opacity-100 sí dispare la transición.
      void colorEl.offsetHeight
      requestAnimationFrame(() => {
        colorEl.className = `pointer-events-none fixed inset-0 z-[200] ease-out ${color} opacity-100 transition-opacity duration-[320ms]`
        img.className = 'w-56 max-w-[70vw] object-contain scale-100 opacity-100 transition-all duration-300 ease-out'
      })
    }

    setTimeout(() => {
      window.location.href = to
    }, PAGE_WIPE_COVER_MS)
  }

  // Color de portada por módulo (mismos hex que MODULE_COLORS en Code.gs).
  // Cualquier link interno no listado aquí (ej. "Inicio") usa el color por
  // defecto de pageWipeTo.
  const PAGE_WIPE_COLORS = {
    'gestion-personal': 'bg-latam-diavivo',
    'mi-rol': 'bg-latam-estrellada',
    'gestion-operacional': 'bg-latam-profunda',
  }

  // Intercepta TODOS los links internos `href="?page=..."` del sitio (Home,
  // Header desktop/móvil, dropdowns, botones "volver al inicio", etc.) desde
  // un solo lugar — así ningún link nuevo se queda sin la animación por
  // olvido, que fue justo lo que pasó con "Inicio" al cablear tarjeta por
  // tarjeta. En desktop no hace nada (deja la navegación normal del <a>).
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]')
    if (!a || a.target === '_blank' || a.hasAttribute('data-no-wipe')) return
    const href = a.getAttribute('href')
    if (!href || href.charAt(0) !== '?') return
    const params = new URLSearchParams(href.slice(1))
    const page = (params.get('page') || 'home').toLowerCase()

    // Home / Gestión Personal: nunca navegan, solo cambian de vista por JS.
    if (document.getElementById('view-' + page)) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return
      e.preventDefault()
      showView(page)
      closeAllMenus()
      const item = params.get('item')
      if (page === 'gestion-personal' && item && typeof selectHubItem === 'function') {
        setTimeout(() => selectHubItem(item), 50)
      }
      if (page === 'mi-rol' && item && typeof selectHubItemMiRol === 'function') {
        setTimeout(() => selectHubItemMiRol(item), 50)
      }
      if (page === 'gestion-operacional' && item && typeof selectHubItemGestionOperacional === 'function') {
        setTimeout(() => selectHubItemGestionOperacional(item), 50)
      }
      return
    }

    // Cualquier otro link interno (hoy no debería quedar ningún módulo sin
    // migrar, pero se deja como red de seguridad para uno nuevo que caiga en
    // Placeholder.html): sigue siendo navegación real de página, pero igual
    // cierra el header antes de irse (misma lógica que React).
    closeAllMenus()
    if (!pageWipeIsMobile()) return
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return
    e.preventDefault()
    const color = PAGE_WIPE_COLORS[page] || 'bg-latam-estrellada'
    const img = a.querySelector('img')
    const label = (a.querySelector('h3') || a).textContent.trim()
    pageWipeTo(href, color, label, img ? img.src : '')
  })

  // Si llegamos a esta página por un pageWipeTo() de la anterior, el script
  // inline del <body> ya dejó la cobertura visible de entrada (sin parpadeo).
  // Aquí solo la desvanecemos una vez que la página terminó de cargar.
  if (window.__pageWipeData) {
    const color = window.__pageWipeData.color || 'bg-latam-estrellada'
    const colorEl = document.getElementById('page-wipe-color')
    const wrap = document.getElementById('page-wipe-icon-wrap')
    const img = document.getElementById('page-wipe-icon')
    setTimeout(() => {
      if (colorEl) colorEl.className = `pointer-events-none fixed inset-0 z-[200] ease-out ${color} opacity-0 transition-opacity duration-[380ms]`
      if (img) img.className = 'w-56 max-w-[70vw] object-contain scale-0 opacity-0 transition-all duration-[380ms] ease-in'
      setTimeout(() => {
        if (wrap) { wrap.classList.add('hidden'); wrap.classList.remove('flex') }
      }, PAGE_WIPE_REVEAL_MS)
    }, 60)
  }
</script>
