  <body class="flex min-h-screen flex-col bg-[#F5F5FA] text-[#181433] antialiased">
    <div id="page-wipe-color" aria-hidden class="pointer-events-none fixed inset-0 z-[200] opacity-0"></div>
    <div id="page-wipe-icon-wrap" aria-hidden class="pointer-events-none fixed inset-0 z-[210] hidden flex-col items-center justify-center sm:hidden">
      <img id="page-wipe-icon" src="" alt="" class="w-56 max-w-[70vw] object-contain opacity-0" />
    </div>
    <script>
      // Corre lo antes posible (antes del Header/contenido real) para que,
      // si venimos de un pageWipeTo() de la página anterior, la cobertura ya
      // esté visible desde el primer frame — sin parpadeo del contenido de
      // debajo mientras el resto de la página (278KB de CSS incluidos) carga.
      (function () {
        var raw
        try { raw = sessionStorage.getItem('sabPageWipe') } catch (e) { raw = null }
        if (!raw) return
        try { sessionStorage.removeItem('sabPageWipe') } catch (e) {}
        if (!window.matchMedia('(max-width: 639px)').matches) return
        var data
        try { data = JSON.parse(raw) } catch (e) { return }
        if (!data) return
        var colorEl = document.getElementById('page-wipe-color')
        var wrap = document.getElementById('page-wipe-icon-wrap')
        var img = document.getElementById('page-wipe-icon')
        colorEl.className = 'pointer-events-none fixed inset-0 z-[200] opacity-100 ' + (data.color || 'bg-latam-estrellada')
        img.src = data.icon || ''
        img.alt = data.label || ''
        img.className = 'w-56 max-w-[70vw] object-contain opacity-100 scale-100'
        wrap.className = 'pointer-events-none fixed inset-0 z-[210] flex flex-col items-center justify-center sm:hidden'
        window.__pageWipeData = data
      })()
    </script>
    <?!= include('Header') ?>

    <main class="flex-1">
      <? if (page === 'home') { ?>
        <?!= include('Home') ?>
      <? } else if (modulePageFile) { ?>
        <?!= include(modulePageFile, { itemId: itemId }) ?>

        <?!= include('Placeholder') ?>
      <? } ?>
    </main>

    <?!= include('Footer') ?>
    <?!= include('Modals') ?>
    <?!= include('Scripts') ?>
    <? if (modulePageFile === 'GestionPersonal') { ?>
      <?!= include('ActualizacionDatosScript') ?>
    <? } ?>
  </body>
</html>
